<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none">
  <rect width="320" height="280" rx="12" fill="rgba(255,255,255,0.1)"/>

  <!-- Monitor -->
  <rect x="80" y="40" width="160" height="110" rx="8" fill="rgba(255,255,255,0.15)"/>
  <rect x="90" y="50" width="140" height="85" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="140" y="150" width="40" height="12" fill="rgba(255,255,255,0.15)"/>
  <rect x="120" y="158" width="80" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>

  <!-- Code lines on screen -->
  <rect x="100" y="60" width="60" height="4" rx="2" fill="#e8a838" opacity="0.7"/>
  <rect x="100" y="70" width="90" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="100" y="80" width="45" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="100" y="90" width="75" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="100" y="100" width="55" height="4" rx="2" fill="#a8d4ce" opacity="0.6"/>
  <rect x="100" y="110" width="80" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="100" y="120" width="40" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>

  <!-- Person 1 -->
  <circle cx="100" cy="210" r="18" fill="rgba(255,255,255,0.2)"/>
  <circle cx="100" cy="200" r="10" fill="rgba(255,255,255,0.25)"/>
  <rect x="85" y="215" width="30" height="35" rx="6" fill="rgba(255,255,255,0.2)"/>

  <!-- Person 2 -->
  <circle cx="160" cy="205" r="18" fill="rgba(255,255,255,0.2)"/>
  <circle cx="160" cy="195" r="10" fill="rgba(255,255,255,0.25)"/>
  <rect x="145" y="210" width="30" height="35" rx="6" fill="rgba(255,255,255,0.2)"/>

  <!-- Person 3 -->
  <circle cx="220" cy="210" r="18" fill="rgba(255,255,255,0.2)"/>
  <circle cx="220" cy="200" r="10" fill="rgba(255,255,255,0.25)"/>
  <rect x="205" y="215" width="30" height="35" rx="6" fill="rgba(255,255,255,0.2)"/>

  <!-- Q logo -->
  <circle cx="260" cy="70" r="16" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="260" y="76" text-anchor="middle" font-size="16" fill="rgba(255,255,255,0.6)" font-weight="bold">Q</text>
</svg>
