  <!-- Truck -->
  <rect x="280" y="330" width="80" height="35" rx="4" fill="#1a5c52"/>
  <rect x="260" y="340" width="25" height="25" rx="3" fill="#144a42"/>
  <rect x="265" y="344" width="15" height="12" rx="2" fill="#a8d4ce"/>
  <circle cx="278" cy="368" r="8" fill="#333"/>
  <circle cx="278" cy="368" r="4" fill="#666"/>
  <circle cx="345" cy="368" r="8" fill="#333"/>
  <circle cx="345" cy="368" r="4" fill="#666"/>

  <!-- Container 1 -->
  <rect x="380" y="290" width="30" height="30" rx="3" fill="#e8a838"/>
  <rect x="382" y="287" width="26" height="5" rx="2" fill="#c48a20"/>
