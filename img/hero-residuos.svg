  <rect x="457" y="272" width="6" height="20" rx="2" fill="#1a5c52" opacity="0.35"/>

  <!-- Map pin -->
  <g transform="translate(150, 80)">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="#e8a838"/>
